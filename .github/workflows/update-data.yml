name: 每日更新資料包

# 台股收盤後自動更新股價+掃描，重壓資料包上傳到 Release，雲端隔天自動抓新資料。
# 保底：先下載現有資料包→在上面增量更新→健檢通過才覆蓋，更新失敗也不會清空既有資料。

on:
  schedule:
    - cron: "0 9 * * 1-5"        # UTC 09:00 = 台灣 17:00（收盤後），週一~五
  workflow_dispatch: {}          # 也可到 Actions 頁手動按執行

permissions:
  contents: write                 # 需要寫 Release + push 選股 csv

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件（精簡：更新+掃描需要的）
        run: pip install --quiet pandas numpy requests yfinance lxml beautifulsoup4 matplotlib

      - name: 下載現有資料包並解開（保底基準）
        run: |
          curl -fsSL -o data_pack.zip \
            "https://github.com/${{ github.repository }}/releases/download/data-v1/data_pack.zip" || true
          if [ -f data_pack.zip ]; then unzip -q -o data_pack.zip && rm -f data_pack.zip; fi
          echo "更新前價格檔數：$(ls data/*.TW.csv data/*.TWO.csv 2>/dev/null | wc -l)"

      - name: 更新股價 + 掃描選股
        run: |
          python updater.py 2>&1 | tail -5 || echo "::warning::updater 部分失敗，續跑"
          echo "----- 產業新聞掃描 -----"
          python fetch_news.py --sectors 2>&1 | tail -3 || echo "::warning::news 抓取失敗，續跑"
          echo "----- 三大法人增量 -----"
          python fetch_institutional.py --mode update 2>&1 | tail -3 || echo "::warning::institutional 失敗，續跑"
          echo "----- 融資融券增量 -----"
          python fetch_margin.py --mode update 2>&1 | tail -3 || echo "::warning::margin 失敗，續跑"
          echo "----- 開始掃描 -----"
          python scan_signals.py > scan.log 2>&1 || echo "::warning::scan 非零退出"
          tail -25 scan.log
          today=$(date -u +%Y%m%d)
          if [ -f "scan_results/signals_${today}.csv" ]; then
            echo "✅ 已產生 signals_${today}.csv（$(( $(wc -l < scan_results/signals_${today}.csv) - 1 )) 檔）"
          else
            echo "::warning::未產生 signals_${today}.csv（見上方掃描輸出）"
          fi

      - name: 健檢（價格檔要夠多才上傳，避免壞包覆蓋好包）
        run: |
          n=$(ls data/*.TW.csv data/*.TWO.csv 2>/dev/null | wc -l)
          echo "更新後價格檔數：$n"
          if [ "$n" -lt 1500 ]; then echo "::error::價格檔太少($n)，中止上傳"; exit 1; fi
          echo "最新股價日：$(tail -1 data/2330.TW.csv | cut -d, -f1)"

      - name: 重壓資料包（含 scan_results，排除個人/暫存檔）
        run: |
          zip -q -r -X data_pack.zip data scan_results \
            -x "data/portfolio_*.csv" "data/notify_*.json" "data/*.log" \
               "data/_*.flag" "data/_*.txt" "data/_progress.json" "data/_market_margin.csv"
          ls -lh data_pack.zip

      - name: 覆蓋上傳到 Release data-v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload data-v1 data_pack.zip --clobber

      - name: 通知雲端刷新（更新標記→push→Streamlit 自動重部署抓新包）
        run: |
          git config user.name  "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          stamp="$(date -u '+%Y-%m-%d %H:%M UTC')"
          pdate="$(tail -1 data/2330.TW.csv | cut -d, -f1)"
          # 更新標記檔（每次都會變）→ 保證有一個 commit 可推，才會觸發雲端重部署
          echo "auto_update=${stamp} | 資料日=${pdate}" > .last_data_update
          latest="$(ls -t scan_results/signals_*.csv 2>/dev/null | head -1)"
          git add -f .last_data_update ${latest:+"$latest"}
          git commit -m "chore(data): 自動更新資料日 ${pdate} (${stamp})" || { echo "無變更，略過"; exit 0; }
          git pull --rebase origin main || true
          git push origin HEAD:main \
            || echo "::warning::push 失敗——請確認 Settings→Actions→General→Workflow permissions 設為『Read and write』"
